<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Safari de las Sumas</title>
<style>
:root{
  --cielo:#bfe9ff; --sabana:#ffe9a8; --tierra:#c98a4b; --tinta:#2b2d42; --suave:#6b6f86;
  --g1:#ff6b6b; --g2:#4dabf7; --ok:#51cf66; --oro:#ffd43b; --card:#ffffff; --sombra:0 6px 0 rgba(0,0,0,.14);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:ui-rounded,"SF Pro Rounded","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--tinta);
  background:linear-gradient(180deg,var(--cielo) 0%,#e8f7ff 45%,var(--sabana) 45.1%,#ffd77a 100%) fixed;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid #7048e8;outline-offset:3px}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border-bottom:3px solid rgba(0,0,0,.06)}
#top .marca{font-weight:900;font-size:clamp(16px,2.4vw,24px);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top button{min-width:52px;height:52px;border-radius:16px;background:#fff;box-shadow:var(--sombra);font-size:26px}
#top button.off{opacity:.45;filter:grayscale(1)}
#app{padding:clamp(10px,2vw,26px);max-width:1500px;margin:0 auto}
h1{font-size:clamp(34px,6.5vw,78px);margin:.1em 0;line-height:1;text-shadow:0 4px 0 rgba(255,255,255,.7)}
h2{font-size:clamp(22px,3.4vw,40px);margin:.2em 0}
h3{margin:.2em 0;font-size:clamp(16px,2vw,22px)}
.sub{font-size:clamp(16px,2.2vw,26px);margin:.2em 0 1em;color:var(--suave);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:12px 26px;border-radius:20px;background:#fff;box-shadow:var(--sombra);font-size:clamp(18px,2.4vw,28px);font-weight:900}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn.verde{background:var(--ok);color:#10300f}.btn.oro{background:var(--oro)}.btn.azul{background:var(--g2);color:#06243d}.btn.rojo{background:#ffa8a8}
.btn[disabled]{opacity:.4;pointer-events:none}
/* inicio */
.inicio{text-align:center}
.logo{font-size:clamp(44px,8vw,100px);letter-spacing:.1em;margin-top:10px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;margin:18px auto;max-width:1200px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px;border-radius:var(--r);box-shadow:var(--sombra);background:#fff;text-align:center}
.card i{font-style:normal;font-size:clamp(46px,7vw,86px)}
.card b{font-size:clamp(22px,3vw,34px)}
.card span{font-size:clamp(14px,1.8vw,20px);color:var(--suave);font-weight:700}
.card.c1{background:#ffe3e3}.card.c2{background:#fff3bf}.card.c3{background:#d3f9d8}.card.c4{background:#e5dbff}
.card:active{transform:translateY(4px)}
/* chips y ajustes */
.panel{background:rgba(255,255,255,.92);border-radius:var(--r);box-shadow:var(--sombra);padding:clamp(14px,2.4vw,28px);margin:14px auto;max-width:1100px}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.fila>label{font-weight:900;min-width:min(100%,210px);font-size:clamp(16px,2vw,22px)}
.chip{min-width:64px;min-height:56px;padding:8px 18px;border-radius:16px;background:#f1f3f5;box-shadow:0 4px 0 rgba(0,0,0,.12);font-weight:900;font-size:clamp(16px,2vw,24px)}
.chip.sel{background:var(--oro);outline:4px solid #f08c00}
.centro{text-align:center}
/* aprende */
.busca{display:flex;align-items:center;gap:12px;max-width:1000px;margin:6px auto;font-size:clamp(18px,2.6vw,30px);font-weight:800}
.busca .buho{font-size:clamp(46px,6vw,80px)}
.busca .globo{background:#fff;border-radius:22px;padding:12px 20px;box-shadow:var(--sombra)}
.stepper{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(6px,1.6vw,20px);margin:12px 0;font-weight:900}
.num{display:flex;align-items:center;gap:8px}
.num b,.stepper .res{min-width:1.3em;text-align:center;font-size:clamp(54px,9vw,120px);line-height:1}
.num .a{color:var(--g1)}.num .b{color:var(--g2)}.stepper .res{color:#2f9e44}
.stepper .sym{font-size:clamp(40px,7vw,90px)}
.mini{width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:var(--sombra);font-size:34px;font-weight:900}
.repgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.repcard{background:#fff;border-radius:var(--r);box-shadow:var(--sombra);padding:14px 16px}
.repcard header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.repcard header .btn{min-height:48px;padding:6px 16px;font-size:20px}
.repcard p.cap{margin:8px 0 0;color:var(--suave);font-weight:700;font-size:clamp(14px,1.7vw,19px)}
/* representaciones */
.rep{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;min-height:130px;padding:8px}
.rep .st{transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.rep .st:not(.on){opacity:.1;transform:scale(.5)}
.rep .op{font-size:40px;font-weight:900}
.r-contar .g{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:46%}
.r-contar .it{font-size:clamp(28px,3.6vw,46px);line-height:1}
.r-contar .g1 .it{filter:drop-shadow(0 0 0 var(--g1));background:rgba(255,107,107,.22);border-radius:12px;padding:2px}
.r-contar .g2 .it{background:rgba(77,171,247,.24);border-radius:12px;padding:2px}
.r-contar.peq .it{font-size:clamp(24px,3vw,38px)}
.r-contar .tot,.r-palitos .atado{font-size:clamp(30px,4vw,52px);font-weight:900;background:#d3f9d8;border-radius:16px;padding:4px 16px}
.r-dedos{gap:22px}
.bub{display:flex;flex-direction:column;align-items:center;background:#fff3bf;border:4px dashed #f08c00;border-radius:50%;width:clamp(96px,11vw,140px);height:clamp(96px,11vw,140px);justify-content:center;font-size:36px}
.bub b{font-size:clamp(34px,4.5vw,58px);line-height:1}.bub small{font-size:13px;font-weight:800}
.mano{display:flex;align-items:flex-end;gap:7px;padding:10px 14px 0;background:#ffd8a8;border-radius:30px 30px 18px 18px;min-width:210px;justify-content:center}
.mano .f{position:relative;width:clamp(30px,3.6vw,42px);height:42px;border-radius:18px 18px 8px 8px;background:#f4b97a;transition:height .35s cubic-bezier(.3,1.6,.5,1)}
.mano .f:nth-child(1){height:34px;transform:rotate(-14deg)}
.mano .f.st.on{height:110px;background:var(--g2);opacity:1;transform:none}
.mano .f.st:not(.on){opacity:1;transform:none}
.mano .f:nth-child(1).st.on{height:92px;transform:rotate(-8deg)}
.mano .f b{position:absolute;top:6px;left:0;right:0;text-align:center;color:#fff;font-size:22px;opacity:0}
.mano .f.on b{opacity:1}
.r-marco .marco{display:grid;grid-template-columns:repeat(5,clamp(40px,5.2vw,64px));gap:6px;padding:8px;background:#eef2f6;border-radius:14px}
.r-marco .marco i{aspect-ratio:1;border-radius:12px;background:#fff;border:3px solid #ced4da;display:block}
.r-marco .marco i.g1{background:var(--g1);border-color:#e03131}.r-marco .marco i.g2{background:var(--g2);border-color:#1971c2}
.r-marco .falta{flex-basis:100%;text-align:center;margin:0;font-weight:800}
.r-recta{padding:34px 8px 6px}
.linea{position:relative;display:flex;width:100%;max-width:700px;border-top:6px solid var(--tinta);margin-top:56px}
.tick{flex:1;text-align:center;font-weight:900;font-size:clamp(16px,2.2vw,26px);padding-top:6px;border-radius:0 0 12px 12px;transition:background .3s}
.tick.start{background:#ffe3e3;color:var(--g1)}.tick.hl{background:#d0ebff;color:#1864ab}
.arco{position:absolute;bottom:2px;width:calc(100%/11);height:42px;transform:translateX(-50%);border:5px solid var(--g2);border-bottom:0;border-radius:50% 50% 0 0;text-align:center;font-weight:900;font-size:16px;color:#1864ab;transition:opacity .3s}
.arco span{position:relative;top:-24px;background:#fff;border-radius:8px;padding:0 4px}
.rana{position:absolute;bottom:34px;font-size:clamp(30px,4vw,48px);transform:translateX(-50%);transition:left .55s cubic-bezier(.4,1.5,.5,1)}
.rep.r-recta{overflow:visible}
.r-palitos{gap:16px}
.monton{display:flex;align-items:flex-end;gap:5px;flex-wrap:wrap;justify-content:center;max-width:42%}
.pal{display:block;width:11px;height:clamp(54px,6vw,76px);border-radius:6px;background:linear-gradient(90deg,#d9a066,#b9773a);border-top:6px solid var(--g1)}
.monton.g2 .pal{border-top-color:var(--g2)}
.pal:nth-child(5n){margin-right:12px}
/* juego */
.marcador{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;justify-content:center;margin-bottom:10px}
.eq{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:18px;background:#fff;border:5px solid transparent;box-shadow:var(--sombra);font-size:clamp(18px,2.6vw,30px);font-weight:900}
.eq .em{font-size:clamp(30px,4vw,48px)}
.eq.act{border-color:var(--c);transform:translateY(-4px) scale(1.04)}
.eq small{font-size:.6em;color:#e8590c}
.info{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;font-weight:900;font-size:clamp(16px,2.2vw,26px);margin-bottom:8px}
.info .pill{background:#fff;border-radius:999px;padding:6px 16px;box-shadow:var(--sombra)}
.barra{width:min(320px,80vw);height:22px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
.barra i{display:block;height:100%;background:linear-gradient(90deg,#fcc419,#51cf66);transition:width .6s}
.tablero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.tablero{grid-template-columns:1fr}}
.pregunta{background:rgba(255,255,255,.94);border-radius:var(--r);box-shadow:var(--sombra);padding:14px;text-align:center}
.turno{font-weight:900;font-size:clamp(18px,2.6vw,30px);margin-bottom:6px}
.pregunta .rep{min-height:0}
.ops{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,28px);font-weight:900;font-size:clamp(60px,11vw,150px);line-height:1.05}
.ops .a{color:var(--g1)}.ops .b{color:var(--g2)}.ops .int{color:#f08c00;animation:bota 1.4s infinite}
.ops .sym{font-size:.7em}
@keyframes bota{50%{transform:translateY(-10px)}}
.pistas{background:rgba(255,255,255,.94);border-radius:var(--r);box-shadow:var(--sombra);padding:12px;min-height:280px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.chips .chip{min-width:0;font-size:clamp(14px,1.7vw,20px)}
.chip.ab{background:#d0ebff}.chip.ver{background:var(--oro);outline:3px solid #f08c00}
.vacio{padding:20px;text-align:center;color:var(--suave);font-weight:800;font-size:clamp(15px,1.9vw,22px)}
.teclado{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:14px auto;max-width:1100px}
@media (max-width:720px){.teclado{grid-template-columns:repeat(5,1fr)}}
.teclado button{min-height:clamp(58px,9vw,96px);border-radius:18px;background:#fff;box-shadow:var(--sombra);font-size:clamp(28px,4.6vw,56px);font-weight:900}
.teclado button:nth-child(odd){background:#fff0f0}.teclado button:nth-child(even){background:#edf6ff}
.teclado button.mal{background:#ced4da;color:#868e96;pointer-events:none;animation:tiembla .4s}
@keyframes tiembla{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.acciones{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.msg{min-height:44px;text-align:center;font-weight:900;font-size:clamp(18px,2.6vw,30px);margin:10px 0;color:#c2255c}
/* misión */
.ruta{position:relative;display:flex;align-items:center;justify-content:space-between;margin:8px auto 14px;padding:36px 10px 8px;max-width:1100px;background:rgba(255,255,255,.7);border-radius:var(--r);box-shadow:var(--sombra)}
.ruta::before{content:"";position:absolute;left:30px;right:30px;top:62px;height:10px;border-radius:5px;background:repeating-linear-gradient(90deg,#c98a4b 0 22px,transparent 22px 36px)}
.parada{position:relative;z-index:1;width:clamp(26px,5vw,48px);height:clamp(26px,5vw,48px);border-radius:50%;background:#fff;border:4px solid #c98a4b;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,2.4vw,26px)}
.parada.hecha{background:var(--ok);border-color:#2b8a3e}.parada.estrella{background:var(--oro);border-color:#f08c00}
.parada.meta{width:clamp(44px,8vw,78px);height:clamp(44px,8vw,78px);font-size:clamp(26px,5vw,52px);background:#fff3bf}
.jeep{position:absolute;top:0;font-size:clamp(30px,5vw,56px);transform:translateX(-50%);transition:left .9s cubic-bezier(.5,1.3,.5,1)}
/* capa de feedback */
#capa{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(43,45,66,.45);padding:16px}
#capa.on{display:flex}
.modal{background:#fff;border-radius:30px;padding:clamp(18px,3vw,40px);max-width:760px;width:100%;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.18);animation:sale .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes sale{from{transform:scale(.5);opacity:0}}
.modal .grande{font-size:clamp(50px,9vw,110px);line-height:1}
.modal h2{margin:.2em 0}
.estr{font-size:clamp(34px,6vw,64px);letter-spacing:.1em}
.conf{position:fixed;top:-60px;z-index:60;pointer-events:none;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(115vh) rotate(720deg)}}
/* podio */
.podio{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,24px);margin:20px auto;min-height:300px}
.puesto{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:clamp(100px,22vw,220px)}
.puesto .em{font-size:clamp(48px,9vw,100px);animation:bota 1.6s infinite}
.puesto .peana{width:100%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:10px;font-weight:900;box-shadow:var(--sombra)}
.puesto .peana b{font-size:clamp(26px,4vw,48px)}
.p1 .peana{height:230px;background:#ffd43b}.p2 .peana{height:170px;background:#dee2e6}.p3 .peana{height:120px;background:#e8a96a}.p4 .peana{height:80px;background:#f1f3f5}
.premios{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0}
.premio{background:#fff;border-radius:18px;padding:10px 18px;font-weight:900;font-size:clamp(16px,2.2vw,24px);box-shadow:var(--sombra)}
/* maestra */
.doc{max-width:980px;margin:0 auto;font-size:clamp(16px,1.9vw,21px);line-height:1.5}
.doc h2{margin-top:1.1em}
.doc .caja{background:#fff;border-radius:18px;padding:12px 18px;margin:12px 0;box-shadow:var(--sombra)}
.doc .caja.ok{background:#ebfbee}.doc .caja.ojo{background:#fff4e6}
.doc a{color:#1864ab;font-weight:800;word-break:break-all}
.doc small{color:var(--suave)}
.doc li{margin:6px 0}
/* diploma (solo impresión) */
#diploma{display:none}
@media print{
  body>*:not(#diploma){display:none!important}
  body{background:#fff}
  #diploma{display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100vh;border:18px double #f08c00;margin:0;padding:30px}
  #diploma .t{font-size:70px;font-weight:900}#diploma .e{font-size:170px}#diploma .n{font-size:64px;font-weight:900}#diploma .p{font-size:30px;max-width:80%}
  @page{size:A4 landscape;margin:8mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="top">
  <button data-act="ir" data-p="inicio" aria-label="Inicio" title="Inicio">🏠</button>
  <div class="marca">🦁 Safari de las Sumas</div>
  <button id="bSon" data-act="tog" data-k="sonido" aria-label="Sonido" title="Sonido">🔊</button>
  <button id="bVoz" data-act="tog" data-k="voz" aria-label="Voz" title="Voz que lee los números">🗣️</button>
  <button data-act="full" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
</div>
<main id="app"></main>
<div id="capa" role="dialog" aria-live="polite"></div>
<div id="diploma"></div>

<script>
(function (root) {
'use strict';

/* ============ LÓGICA PURA (se prueba aparte) ============ */
var NUM = ['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte'];
var NIVELES = [null,
  { id: 1, nombre: 'Selva',  emoji: '🌴', min: 2, max: 5 },
  { id: 2, nombre: 'Sabana', emoji: '🌾', min: 4, max: 7 },
  { id: 3, nombre: 'Volcán', emoji: '🌋', min: 6, max: 10 }];
var TEMAS = ['🍎','🐟','🌟','🎈','🐝','🍓','🦋','🍪','🐞','🍌'];
var EQUIPOS = [
  { e: '🦁', n: 'Leones',    c: '#ff9f1c' },
  { e: '🐘', n: 'Elefantes', c: '#3a86ff' },
  { e: '🦒', n: 'Jirafas',   c: '#06d6a0' },
  { e: '🐒', n: 'Monos',     c: '#ef476f' }];
var PARADAS = 12;

function ri(rng, n) { return Math.floor(rng() * n); }
function genProblema(nivel, usados, rng) {
  rng = rng || Math.random; var N = NIVELES[nivel], tries = 0, a, b, s;
  do { s = N.min + ri(rng, N.max - N.min + 1); a = 1 + ri(rng, s - 1); b = s - a; tries++; }
  while (usados && usados[a + '+' + b] && tries < 40);
  if (usados) usados[a + '+' + b] = 1;
  return { a: a, b: b, sum: s, nivel: nivel };
}
/* una ronda: la MISMA suma para todos los equipos, repartida de formas distintas (misma dificultad para todos) */
function genRonda(nivel, n, evitarSuma, rng) {
  rng = rng || Math.random; var N = NIVELES[nivel], s, t = 0;
  do { s = N.min + ri(rng, N.max - N.min + 1); t++; } while (s === evitarSuma && t < 12 && N.max > N.min);
  var c = [], i, j, tmp, out = [];
  for (i = 1; i < s; i++) c.push(i);
  for (i = c.length - 1; i > 0; i--) { j = ri(rng, i + 1); tmp = c[i]; c[i] = c[j]; c[j] = tmp; }
  for (i = 0; i < n; i++) { var a = c[i % c.length]; out.push({ a: a, b: s - a, sum: s, nivel: nivel }); }
  return out;
}
function puntos(pistas) { return pistas <= 0 ? 3 : pistas <= 2 ? 2 : 1; }
function nivelRonda(r, rondas) { return Math.min(3, 1 + Math.floor(r * 3 / rondas)); }
function nivelParada(pos) { return pos < 4 ? 1 : pos < 8 ? 2 : 3; }
function ranking(eq) {
  var o = eq.map(function (e, i) { return { i: i, e: e }; });
  o.sort(function (x, y) { return y.e.pts - x.e.pts || y.e.aciertos - x.e.aciertos; });
  var p = 1;
  o.forEach(function (x, k) { if (k > 0 && (x.e.pts !== o[k - 1].e.pts)) p = k + 1; x.puesto = p; });
  return o;
}
function estrellasMision(sinAyuda, total) { var f = total ? sinAyuda / total : 0; return f >= 0.75 ? 3 : f >= 0.5 ? 2 : 1; }
function mayor(a, b) { return Math.max(a, b); }
function menor(a, b) { return Math.min(a, b); }

/* ============ ESTADO Y AJUSTES ============ */
var CLAVE = 'suma-safari-ajustes';
var S = {

try { var gu = JSON.parse(localStorage.getItem(CLAVE) || 'null'); if (gu) for (var k in gu) if (k in S.cfg) S.cfg[k] = gu[k]; } catch (e) {}

var APP = $('#app'), CAPA = $('#capa');

/* ============ SONIDO, VOZ, TEMPORIZADORES, CONFETI ============ */
var AC = null;
function audio() { if (!AC) { try { AC = new (root.AudioContext || root.webkitAudioContext)(); } catch (e) {} } return AC; }
function tono(f, d, tipo, delay, vol) {
  if (!S.cfg.sonido) return; var ac = audio(); if (!ac) return;
  try {
    var o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + (delay || 0);
    o.type = tipo || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(vol || .12, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + .02);
  } catch (e) {}
}
function sonBien() { [523, 659, 784, 1047].forEach(function (f, i) { tono(f, .2, 'triangle', i * .09); }); }
function sonMal() { tono(240, .22, 'sine', 0, .1); tono(200, .28, 'sine', .14, .1); }
function sonTic() { tono(880, .07, 'square', 0, .04); }
function sonFin() { [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { tono(f, .25, 'triangle', i * .13); }); }
function decir(t) {
  if (!S.cfg.voz || !root.speechSynthesis) return;
  try { root.speechSynthesis.cancel(); var u = new root.SpeechSynthesisUtterance(t); u.lang = 'es-ES'; u.rate = .9; root.speechSynthesis.speak(u); } catch (e) {}
}
var T = { l: [], set: function (f, ms) { var id = setTimeout(f, ms); this.l.push(id); return id; }, clear: function () { this.l.forEach(clearTimeout); this.l = []; } };
var REDUCIDO = !!(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);
function confeti(n) {
  if (REDUCIDO) return; var em = ['🎉', '⭐', '🎊', '✨', '🌟', '🎈'], cols = ['#ff6b6b', '#ffd43b', '#4dabf7', '#51cf66', '#cc5de8'];
  n = n || 50; var cont = [];
  for (var i = 0; i < n; i++) {
    var d = document.createElement('div'); d.className = 'conf';
    d.textContent = i % 3 === 0 ? em[i % em.length] : '■'; d.style.color = cols[i % cols.length];
    d.style.left = (Math.random() * 100) + 'vw'; d.style.fontSize = (14 + Math.random() * 22) + 'px';
    d.style.animationDuration = (2 + Math.random() * 2.2) + 's'; d.style.animationDelay = (Math.random() * .6) + 's';
    document.body.appendChild(d); cont.push(d);
  }
  setTimeout(function () { cont.forEach(function (d) { if (d.parentNode) d.parentNode.removeChild(d); }); }, 5200);
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ============ REPRESENTACIONES (cada una con pasos .st que se pueden reproducir) ============ */
function repContar(a, b, em) {

  h += '</div><span class="op">+</span><div class="g g2">';
  for (i = 1; i <= b; i++) h += '<span class="it st on" data-say="' + (a + i) + '">' + em + '</span>';
  return h + '</div><span class="op">=</span><span class="tot st on" data-say="' + (a + b) + '">' + (a + b) + '</span></div>';
}
function repDedos(a, b) {
  var M = mayor(a, b), m = menor(a, b), i, h = '<div class="rep r-dedos" data-rep="dedos"><div class="bub st on" data-say="' + M + '">🧠<b>' + M + '</b><small>en la cabeza</small></div><div class="mano">';
  for (i = 0; i < 5; i++) {
    if (i < m) h += '<span class="f st on" data-say="' + (M + i + 1) + '"><b>' + (M + i + 1) + '</b></span>';

}

}
function repRecta(a, b) {

  for (i = 1; i <= b; i++) h += '<div class="arco st on" data-say="' + (a + i) + '" data-hl="' + (a + i) + '" style="left:' + pct(a + i - .5) + '%"><span>+1</span></div>';

function repPalitos(a, b) {

}
var REPS = {
  contar: { icono: '🍎', nombre: 'Contar todo', cap: function () { return 'Contamos todo, uno a uno: así se ve que 2 montones juntos son un montón más grande.'; }, html: function (p, em) { return repContar(p.a, p.b, em); } },
  dedos:  { icono: '🖐️', nombre: 'Con los dedos', cap: function (p) { return 'Guardo el más grande (' + mayor(p.a, p.b) + ') en la cabeza 🧠 y sigo contando con los dedos.'; }, html: function (p) { return repDedos(p.a, p.b); } },
  marco:  { icono: '▦', nombre: 'Marco de 10', cap: function () { return 'Cada cuadradito es uno. ¡Se ve cuánto falta para llegar a 10!'; }, html: function (p) { return repMarco(p.a, p.b); } },
  recta:  { icono: '🐸', nombre: 'Recta y rana', cap: function (p) { return 'La rana empieza en ' + p.a + ' y da ' + p.b + ' saltos.'; }, html: function (p) { return repRecta(p.a, p.b); } },
  palitos:{ icono: '🥢', nombre: 'Palitos', cap: function () { return 'Dos montones de palitos: los junto y los cuento (de 5 en 5 se ve mejor).'; }, html: function (p) { return repPalitos(p.a, p.b); } }
};
var ORDEN_PISTAS = ['contar', 'dedos', 'marco', 'recta', 'palitos'];

function play(rep) {
  T.clear(); if (!rep) return;
  var sts = $$('.st', rep), i = 0, ticks = $$('.tick', rep), rana = $('.rana', rep), linea = $('.linea', rep);
  sts.forEach(function (s) { s.classList.remove('on'); });
  ticks.forEach(function (t) { t.classList.remove('hl'); });
  if (rana && linea) rana.style.left = ((+linea.dataset.a + .5) / 11 * 100) + '%';
  (function next() {
    if (i >= sts.length) return;
    var s = sts[i++]; s.classList.add('on'); sonTic();
    if (s.dataset.hl) { var t = $('.tick[data-n="' + s.dataset.hl + '"]', rep); if (t) t.classList.add('hl'); if (rana) rana.style.left = ((+s.dataset.hl + .5) / 11 * 100) + '%'; }
    if (s.dataset.say) decir(NUM[+s.dataset.say] || s.dataset.say);
    T.set(next, 700);
  })();
}

/* ============ PANTALLAS ============ */

/* ---- ajustes del campeonato ---- */

/* ---- el juego (campeonato y misión) ---- */
function apoyoVisible(nivel) {
  var a = S.cfg.apoyo; return a === 'siempre' ? true : a === 'pista' ? false : nivel <= 2;
}
function pJuego() {
  var g = S.g, p = g.p, h = '<section class="juego">';
  if (g.modo === 'camp') {
    h += '<div class="info"><span class="pill">Ronda ' + (g.ronda + 1) + ' de ' + g.rondas + '</span><span class="pill">' + NIVELES[p.nivel].emoji + ' ' + NIVELES[p.nivel].nombre + '</span>' +
      '<span class="pill" title="Meta de la clase">⭐ Clase <span class="barra" style="display:inline-block;width:150px;height:16px;vertical-align:middle"><i style="width:' + Math.min(100, Math.round(100 * total(g) / g.meta)) + '%"></i></span></span></div>';
    h += '<div class="marcador">' + g.equipos.map(function (e, i) {
      return '<div class="eq' + (i === g.turno ? ' act' : '') + '" style="--c:' + e.c + '"><span class="em">' + e.e + '</span><span>' + e.n + '</span><b>' + e.pts + '</b>' + (e.racha >= 2 ? '<small>🔥' + e.racha + '</small>' : '') + '</div>';
    }).join('') + '</div>';
  } else {
    h += '<div class="info"><span class="pill">Parada ' + (g.pos + 1) + ' de ' + PARADAS + '</span><span class="pill">' + NIVELES[p.nivel].emoji + ' ' + NIVELES[p.nivel].nombre + '</span><span class="pill">⭐ ' + g.estrellas + '</span></div>';
    h += '<div class="ruta" id="ruta">' + rutaHTML(g) + '</div>';
  }
  var em = g.emoji;
  h += '<div class="tablero"><div class="pregunta">' +
    (g.modo === 'camp' ? '<div class="turno">Turno de ' + g.equipos[g.turno].e + ' ' + g.equipos[g.turno].n + '</div>' : '<div class="turno">¿Quién sale a la pizarra? 🙋</div>') +
    (apoyoVisible(p.nivel) ? repContar(p.a, p.b, em).replace('class="rep r-contar"', 'class="rep r-contar peq"').replace(/<span class="tot st on"[^>]*>\d+<\/span>/, '<span class="tot">❓</span>') : '') +
    '<div class="ops"><b class="a">' + p.a + '</b><span class="sym">+</span><b class="b">' + p.b + '</b><span class="sym">=</span><b class="int" id="int">❓</b></div></div>' +
    '<aside class="pistas"><div class="chips" id="chips">' + chipsPistas() + '</div><div id="panelPista">' + (g.verPista ? REPS[g.verPista].html(p, em) + '<p class="cap">' + esc(REPS[g.verPista].cap(p)) + '</p>' : '<div class="vacio">' + (S.cfg.pistas ? '💡 Toca una pista si la necesitas.<br>Mirar ayuda… ¡pero se gana un poco menos!' : 'Esta vez, sin pistas. ¡Tú puedes!') + '</div>') + '</div></aside></div>';
  h += '<div class="teclado" id="teclado">';
  for (var n = 1; n <= 10; n++) h += '<button data-act="resp" data-n="' + n + '" aria-label="' + n + '">' + n + '</button>';
  h += '</div><div class="msg" id="msg"></div><div class="acciones">';
  if (S.cfg.pistas) h += '<button class="btn oro" data-act="pista">💡 Pista</button>';
  if (g.modo === 'camp' && S.cfg.ayuda && g.equipos.length > 1) h += '<button class="btn azul" data-act="ayuda" id="bAyuda">🤝 Pedir ayuda a otro equipo</button>';

}
function chipsPistas() {
  var g = S.g; if (!S.cfg.pistas) return '';
  return ORDEN_PISTAS.map(function (k) {
    var ab = g.abiertas.indexOf(k) >= 0;
    return '<button class="chip' + (ab ? ' ab' : '') + (g.verPista === k ? ' ver' : '') + '" data-act="verPista" data-k="' + k + '">' + REPS[k].icono + ' ' + REPS[k].nombre + '</button>';
  }).join('');
}
function rutaHTML(g) {
  var h = '', i;
  for (i = 0; i < PARADAS; i++) {
    var st = g.hist[i]; h += '<div class="parada' + (st === 2 ? ' estrella' : st === 1 ? ' hecha' : '') + (i === PARADAS - 1 ? ' meta' : '') + '">' + (i === PARADAS - 1 ? '⛺' : st === 2 ? '⭐' : st === 1 ? '✓' : (i + 1)) + '</div>';
  }
  var left = g.pos === 0 ? 3 : ((g.pos - 1) / (PARADAS - 1)) * 94 + 3;   /* sale de la parada anterior y se mueve a la actual */
  if (g.fin) left = 97;
  return h + '<div class="jeep" id="jeep" style="left:' + left + '%">🚙</div>';
}

function total(g) { return g.equipos.reduce(function (s, e) { return s + e.pts; }, 0); }

/* ============ FLUJO DEL JUEGO ============ */
function nuevoProblemaCamp() {
  var g = S.g;
  if (g.idx === 0) {
    var niv = S.cfg.nivel === 'prog' ? nivelRonda(g.ronda, g.rondas) : +S.cfg.nivel;
    g.cola = genRonda(niv, g.equipos.length, g.ultSuma);
    g.ultSuma = g.cola[0].sum;
  }
  g.turno = g.idx; g.p = g.cola[g.idx]; resetPregunta();
}
function nuevoProblemaMis() {
  var g = S.g; g.p = genProblema(nivelParada(g.pos), g.usados); resetPregunta();
}
function resetPregunta() {
  var g = S.g; g.abiertas = []; g.verPista = null; g.pistas = 0; g.fallos = 0; g.ayudaDe = null; g.resuelto = false;
  g.emoji = TEMAS[Math.floor(Math.random() * TEMAS.length)];
}
function empezarCamp() {
  var n = S.cfg.equipos;
  S.g = { modo: 'camp', equipos: EQUIPOS.slice(0, n).map(function (e) { return { e: e.e, n: e.n, c: e.c, pts: 0, racha: 0, mejorRacha: 0, aciertos: 0, ayudas: 0 }; }),
    ronda: 0, rondas: S.cfg.rondas, idx: 0, cola: [], ultSuma: 0, meta: S.cfg.rondas * n * 2, log: [] };
  nuevoProblemaCamp(); show('juego'); hablaPregunta();
}
function empezarMis() {
  S.g = { modo: 'mis', pos: 0, hist: [], estrellas: 0, usados: {}, log: [] };
  nuevoProblemaMis(); show('juego'); hablaPregunta();
}
function hablaPregunta() { var p = S.g.p; T.set(function () { decir(NUM[p.a] + ' más ' + NUM[p.b] + '. ¿Cuántos son?'); }, 350); }

function abrirPista(k, cuesta) {
  var g = S.g; if (!S.cfg.pistas || g.resuelto) return;
  if (g.abiertas.indexOf(k) < 0) { g.abiertas.push(k); if (cuesta !== false) g.pistas++; }
  g.verPista = k; refrescaPistas(); play($('#panelPista .rep'));
}
function refrescaPistas() {
  var g = S.g, em = g.emoji; $('#chips').innerHTML = chipsPistas();
  $('#panelPista').innerHTML = g.verPista ? REPS[g.verPista].html(g.p, em) + '<p class="cap">' + esc(REPS[g.verPista].cap(g.p)) + '</p>' : '';
}
function siguientePistaLibre() { var g = S.g, k; for (var i = 0; i < ORDEN_PISTAS.length; i++) { k = ORDEN_PISTAS[i]; if (g.abiertas.indexOf(k) < 0) return k; } return g.abiertas[g.abiertas.length - 1]; }

function responder(n) {
  var g = S.g; if (!g || g.resuelto) return;
  var btn = $('#teclado button[data-n="' + n + '"]');
  if (n === g.p.sum) { acierto(); return; }
  g.fallos++; sonMal(); if (btn) btn.classList.add('mal');
  $('#msg').textContent = '¡Casi! Vamos a mirarlo juntos 🔍';
  decir('Casi. Vamos a mirarlo juntos.');
  if (S.cfg.pistas) { T.set(function () { abrirPista(siguientePistaLibre(), true); }, 900); }
}

function acierto() {
  var g = S.g; g.resuelto = true; var p = g.p; $('#int').textContent = p.sum; sonBien(); confeti(g.modo === 'camp' ? 28 : 22); decir(NUM[p.a] + ' más ' + NUM[p.b] + ' son ' + NUM[p.sum] + '. ¡Muy bien!');
  var sinAyuda = g.pistas === 0 && g.fallos === 0 && g.ayudaDe == null, h;
  g.log.push({ a: p.a, b: p.b, pistas: g.pistas, fallos: g.fallos, ayuda: g.ayudaDe != null });
  if (g.modo === 'camp') {
    var e = g.equipos[g.turno], pts = g.ayudaDe != null ? 2 : puntos(Math.max(g.pistas, g.fallos)), bonus = 0;
    if (sinAyuda) { e.racha++; if (e.racha > e.mejorRacha) e.mejorRacha = e.racha; if (e.racha % 3 === 0) bonus = 1; } else e.racha = 0;
    pts += bonus; e.pts += pts; e.aciertos++;
    if (g.ayudaDe != null) { var hp = g.equipos[g.ayudaDe]; hp.pts += 1; hp.ayudas++; }
    g.ultPts = pts;
    h = '<div class="modal"><div class="grande">' + e.e + '</div><h2>¡Muy bien, ' + e.n + '!</h2><div class="estr">' + '⭐'.repeat(Math.min(pts, 5)) + '</div>' +
      '<p style="font-size:clamp(18px,2.6vw,30px);font-weight:800">' + p.a + ' + ' + p.b + ' = ' + p.sum + (bonus ? '<br>🔥 ¡Racha de 3! +1 ⭐ extra' : '') + (g.ayudaDe != null ? '<br>🤝 ' + g.equipos[g.ayudaDe].e + ' ' + g.equipos[g.ayudaDe].n + ' ganan 1 ⭐ por ayudar' : '') + '</p>' +
      '<button class="btn verde" data-act="sig">Siguiente ➜</button></div>';
  } else {
    var estrella = sinAyuda; g.hist[g.pos] = estrella ? 2 : 1; if (estrella) g.estrellas++;
    h = '<div class="modal"><div class="grande">🚙</div><h2>' + (estrella ? '¡Sin ayuda! ⭐' : '¡Lo hemos resuelto juntos!') + '</h2><p style="font-size:clamp(18px,2.6vw,30px);font-weight:800">' + p.a + ' + ' + p.b + ' = ' + p.sum + '</p>' +
      '<button class="btn verde" data-act="sig">' + (g.pos === PARADAS - 1 ? 'Llegamos ➜' : 'Siguiente parada ➜') + '</button></div>';
  }
  CAPA.innerHTML = h; CAPA.className = 'on';
}

function siguiente() {
  var g = S.g; if (!g || !g.resuelto) return;
  if (g.modo === 'camp') {
    g.idx++;
    if (g.idx >= g.equipos.length) { g.idx = 0; g.ronda++; if (g.ronda >= g.rondas) { sonFin(); show('podio'); confeti(90); return; } }
    nuevoProblemaCamp();
  } else {
    g.pos++; if (g.pos >= PARADAS) { sonFin(); show('finmis'); confeti(110); return; }
    nuevoProblemaMis();
  }
  show('juego'); hablaPregunta();
}

function pedirAyuda() {
  var g = S.g, h = '<div class="modal"><h2>🤝 ¿Qué equipo ayuda a ' + g.equipos[g.turno].e + ' ' + g.equipos[g.turno].n + '?</h2><p style="font-weight:800">Pensáis juntos. Si lo resuelven: quien responde gana 2 ⭐ y quien ayuda, 1 ⭐.</p><div class="fila" style="justify-content:center">';
  g.equipos.forEach(function (e, i) { if (i !== g.turno) h += '<button class="btn" style="border:6px solid ' + e.c + '" data-act="eligeAyuda" data-i="' + i + '">' + e.e + ' ' + e.n + '</button>'; });
  CAPA.innerHTML = h + '</div><button class="btn rojo" data-act="cierra">Mejor no</button></div>'; CAPA.className = 'on';
}

/* ---- podio ---- */
function resumenSesion(log) {
  var n = log.length, pr = log.filter(function (l) { return !l.pistas && !l.fallos && !l.ayuda; }).length, ay = log.filter(function (l) { return l.ayuda; }).length;
  var dif = {}; log.forEach(function (l) { if (l.fallos || l.pistas >= 2) dif[l.a + ' + ' + l.b] = 1; });
  var dd = Object.keys(dif).slice(0, 6);
  return '<div class="premio" style="text-align:left;max-width:640px"><b>📋 Resumen para la maestra</b><br>Sumas resueltas: ' + n + '<br>A la primera y sin ayuda: ' + pr + '<br>Con pista o tras equivocarse: ' + (n - pr - ay) + '<br>Con ayuda de otro equipo: ' + ay +
    '<br>Las que más costaron: ' + (dd.length ? dd.join(' · ') : 'ninguna 🎉') + '</div>';
}
function pPodio() {
  var g = S.g, r = ranking(g.equipos), top = r.filter(function (x) { return x.puesto === 1; });
  var orden = r.length >= 3 ? [r[1], r[0], r[2]].concat(r.slice(3)) : (r.length === 2 ? [r[1], r[0]] : r);
  var medalla = { 1: '🥇', 2: '🥈', 3: '🥉' };
  var maxAy = Math.max.apply(null, g.equipos.map(function (e) { return e.ayudas; })), maxR = Math.max.apply(null, g.equipos.map(function (e) { return e.mejorRacha; }));
  var h = '<section class="centro"><h1>🏆 ¡Podio!</h1><p class="sub">' + (top.length > 1 ? '¡Empate! ' : '¡Ganan los ') + top.map(function (x) { return x.e.e + ' ' + x.e.n; }).join(' y ') + (top.length > 1 ? '' : '!') + '</p><div class="podio">';
  orden.forEach(function (x) { h += '<div class="puesto p' + Math.min(x.puesto, 4) + '"><div class="em">' + x.e.e + '</div><div class="peana"><div>' + (medalla[x.puesto] || '') + ' ' + x.e.n + '</div><b>' + x.e.pts + ' ⭐</b></div></div>'; });
  h += '</div><div class="premios">';
  if (maxAy > 0) h += '<div class="premio">🤝 Más compañerismo: ' + g.equipos.filter(function (e) { return e.ayudas === maxAy; }).map(function (e) { return e.e; }).join(' ') + '</div>';
  if (maxR >= 2) h += '<div class="premio">🔥 Mejor racha: ' + g.equipos.filter(function (e) { return e.mejorRacha === maxR; }).map(function (e) { return e.e; }).join(' ') + ' (' + maxR + ')</div>';
  var t = total(g);
  h += '<div class="premio">' + (t >= g.meta ? '🎉 ¡Meta de la clase conseguida entre todos! (' + t + ' / ' + g.meta + ' ⭐)' : '⭐ La clase juntó ' + t + ' de ' + g.meta + ' ⭐. ¡La próxima la conseguimos!') + '</div></div>';
  h += resumenSesion(g.log) + '<div class="fila" style="justify-content:center"><button class="btn oro" data-act="diploma">🖨️ Diploma</button><button class="btn verde" data-act="empezarCamp">🔁 Otra vez</button><button class="btn" data-act="ir" data-p="inicio">🏠 Inicio</button></div></section>';
  return h;
}
function pFinMis() {
  var g = S.g, sin = g.hist.filter(function (x) { return x === 2; }).length, est = estrellasMision(sin, PARADAS);
  return '<section class="centro"><h1>⛺ ¡Hemos llegado!</h1><div class="estr" style="font-size:clamp(56px,10vw,120px)">' + '⭐'.repeat(est) + '</div><p class="sub">Paradas sin ayuda: ' + sin + ' de ' + PARADAS + '. ¡Lo habéis hecho juntos!</p><div class="ruta">' + rutaHTML(Object.assign({}, g, { pos: PARADAS - 1, fin: true })) + '</div>' + resumenSesion(g.log) +
    '<div class="fila" style="justify-content:center"><button class="btn verde" data-act="empezarMis">🔁 Otra misión</button><button class="btn" data-act="ir" data-p="inicio">🏠 Inicio</button></div></section>';
}
function diploma() {
  var g = S.g, r = ranking(g.equipos), top = r.filter(function (x) { return x.puesto === 1; });
  $('#diploma').innerHTML = '<div class="t">🏆 DIPLOMA 🏆</div><div class="e">' + top.map(function (x) { return x.e.e; }).join(' ') + '</div><div class="n">' + top.map(function (x) { return x.e.n; }).join(' y ') + '</div>' +
    '<div class="p">¡Campeones del Safari de las Sumas! Han sumado con ganas, han pensado juntos y han ayudado a los demás.</div>';
  setTimeout(function () { try { window.print(); } catch (e) {} }, 60);
}

/* ---- Para la maestra ---- */
function doi(d) { return '<a href="https://doi.org/' + d + '" target="_blank" rel="noopener">doi.org/' + d + '</a>'; }
function pMaestra() {
  return '<section class="doc"><h2>🧑‍🏫 Para la maestra</h2>' +
    '<div class="caja ok"><b>En una frase:</b> la evidencia respalda <b>enseñar con varias representaciones a la vez</b> (dedos, material concreto, marco de 10, recta numérica), con <b>juego</b> y <b>sesiones cortas</b>. Dedos y palitos <b>no compiten</b>: esta app muestra los dos en la misma pantalla.</div>' +
    '<h2>Guion de 10–15 minutos</h2><ol>' +
    '<li><b>Cuento (1 min):</b> «Tengo 3 monos y llegan 2 más». Lo dicen y lo mueven con el cuerpo.</li>' +
    '<li><b>Concreto (3 min):</b> en «Aprendemos juntos», palitos y dedos. Contamos en voz alta; probamos la estrategia de guardar el número grande en la cabeza 🧠 y seguir contando con los dedos.</li>' +
    '<li><b>Imagen (3 min):</b> marco de 10 y recta con la rana, para que vean la misma suma de otra forma.</li>' +
    '<li><b>Símbolo (2 min):</b> aparece 3 + 2 = ❓ y relacionan lo que han visto con los números.</li>' +
    '<li><b>Juego (5 min):</b> «Campeonato» o «Misión de la clase». Equipos mixtos; quien ayuda también gana.</li></ol>' +
    '<h2>Qué dice la investigación (verificado en PubMed)</h2>' +
    '<div class="caja"><b>Dedos.</b> Entrenar el conteo con los dedos mejoró la suma en niños de 5–6 años: de 37 % a 77 % de aciertos frente a 40 % → 48 % en el grupo sin entrenamiento (328 niños, Francia; Poletti et al., <i>Child Development</i> 2024). ' + doi('10.1111/cdev.14146') + '<br>En niños de 4–5 años, contar con los dedos mejoró más la suma que contar sobre una recta numérica (190 niños; Krenger et al., <i>J Exp Child Psychol</i> 2026). ' + doi('10.1016/j.jecp.2026.106651') + '<br>Los dedos ayudan sobre todo cuando se empiezan a aprender las sumas, y su beneficio se reduce con los años (Jordan et al., <i>Dev Sci</i> 2008). ' + doi('10.1111/j.1467-7687.2008.00715.x') + '<br>Los niños de 5–6 años más hábiles contando con los dedos dejaban antes esa estrategia y pasaban al cálculo mental a los 7–8 (24 niños; Poletti et al., <i>Children</i> 2022). ' + doi('10.3390/children9020132') + '<br>Mejorar la gnosia digital (saber qué dedo es cuál) con un entrenamiento mejoró la representación y cuantificación con los dedos (47 niños de 1.º; Gracia-Bafalluy y Noël, <i>Cortex</i> 2008). ' + doi('10.1016/j.cortex.2007.08.020') + '</div>' +
    '<div class="caja"><b>Material concreto (palitos, fichas).</b> Un metaanálisis encontró que enseñar con material manipulativo obtuvo mejores resultados que enseñar solo con símbolos, sobre todo en retención, y que el efecto depende de cómo se use (Carbonneau, Marley y Selig, <i>J Educ Psychol</i> 2013). ' + doi('10.1037/a0031084') + ' <small>(revista que PubMed no indexa; el DOI se comprobó en la web)</small></div>' +
    '<div class="caja"><b>Juegos de recta numérica.</b> Jugar a un juego de tablero lineal unos 60 minutos mejoró la comparación de cantidades, la recta numérica, el conteo y los números en preescolares de 5,4 años, con efecto a las 9 semanas; el mismo tablero con colores en vez de números no mejoró nada (Ramani y Siegler, <i>Child Development</i> 2008). ' + doi('10.1111/j.1467-8624.2007.01131.x') + '<br>Con 4 sesiones de 15 minutos se igualó la estimación numérica de niños de familias con menos recursos con la de sus compañeros (Siegler y Ramani, <i>Dev Sci</i> 2008). ' + doi('10.1111/j.1467-7687.2008.00714.x') + '</div>' +
    '<div class="caja"><b>Dificultad que se adapta.</b> El diseño de «The Number Race» (juego adaptativo) se describe en Wilson et al., <i>Behav Brain Funct</i> 2006 ' + doi('10.1186/1744-9081-2-19') + '. Ojo: se probó con solo 9 niños con dificultades; es una referencia de diseño, no una prueba de eficacia.</div>' +
    '<h2>Lo que esta app hace con eso</h2><ul>' +
    '<li><b>Cinco representaciones</b> de la misma suma: contar todo, dedos (el número grande en la cabeza), marco de 10, recta con rana y palitos.</li>' +
    '<li><b>Los dibujos se van quitando</b> (nivel 1 y 2 con fichas; nivel 3 solo números) para pasar de lo concreto a lo abstracto.</li>' +
    '<li><b>Sin reloj:</b> no hay cuenta atrás ni penalización por equivocarse. Un error activa una pista y se vuelve a intentar.</li>' +
    '<li><b>Misma dificultad para todos:</b> en cada ronda todos los equipos tienen la misma suma, repartida de forma distinta.</li>' +
    '<li><b>Colaboración:</b> «pedir ayuda» da 2 ⭐ a quien responde y 1 ⭐ a quien ayuda; hay meta común de la clase y premio al compañerismo.</li></ul>' +
    '<div class="caja ojo"><b>Lo que NO sabemos (ser honestos suma puntos):</b><ul>' +
    '<li>Estos estudios son de Francia, Suiza y EE. UU.; ninguno es de un aula española concreta.</li>' +
    '<li>Esta app <b>no ha sido evaluada</b>. Se apoya en principios con evidencia, pero no hay datos de que ella, en particular, mejore las sumas.</li>' +
    '<li>El <b>campeonato y los puntos</b> son diseño motivacional: no hay estudio aquí que pruebe que mejoren el aprendizaje. Por eso no hay reloj y la clase gana unida.</li>' +
    '<li>Ninguno de los estudios compara «dedos» contra «palitos» con 5 años en el aula: se pueden usar los dos.</li></ul></div>' +
    '<h2>Privacidad</h2><p>Funciona sin internet, no guarda nombres ni datos de niños y no envía nada a ningún sitio. Solo recuerda los ajustes en este navegador.</p>' +
    '<div class="centro"><button class="btn verde" data-act="ir" data-p="aprende">🎓 Ir a «Aprendemos juntos»</button></div></section>';
}

/* ============ EVENTOS ============ */
function azar() {
  var s = 2 + Math.floor(Math.random() * 9), a = 1 + Math.floor(Math.random() * (s - 1)); S.ap = { a: a, b: s - a };
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]'); if (!t) return; var act = t.dataset.act;
  if (act === 'ir') { show(t.dataset.p); return; }
  if (act === 'tog') { S.cfg[t.dataset.k] = !S.cfg[t.dataset.k]; guarda(); t.classList.toggle('off', !S.cfg[t.dataset.k]); if (t.dataset.k === 'voz' && !S.cfg.voz && root.speechSynthesis) root.speechSynthesis.cancel(); return; }
  if (act === 'full') { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {} return; }
  if (act === 'cfg') {
    var v = t.dataset.v; if (t.dataset.n) v = +v; else if (t.dataset.b) v = (v === 'true'); S.cfg[t.dataset.k] = v; guarda(); render(); return;
  }
  if (act === 'da') {
    var w = t.dataset.w, d = +t.dataset.d, a = S.ap.a, b = S.ap.b; if (w === 'a') a += d; else b += d; a = Math.max(1, a); b = Math.max(1, b);
    if (a + b > 10) { if (w === 'a') a = 10 - b; else b = 10 - a; } S.ap = { a: a, b: b }; render(); return;
  }
  if (act === 'azar') { azar(); render(); return; }
  if (act === 'playRep') { play(t.closest('.repcard').querySelector('.rep')); return; }
  if (act === 'playAll') {
    var cards = $$('.repcard .rep'), i = 0; T.clear(); decir(NUM[S.ap.a] + ' más ' + NUM[S.ap.b]);
    (function nx() { if (i >= cards.length) return; var c = cards[i++]; try { c.scrollIntoView({ block: 'center', behavior: REDUCIDO ? 'auto' : 'smooth' }); } catch (e) {} play(c); var n = $$('.st', c).length; T.set(nx, (n + 2) * 700 + 400); })();
    return;
  }
  if (act === 'empezarCamp') { empezarCamp(); return; }
  if (act === 'empezarMis') { empezarMis(); return; }
  if (act === 'resp') { responder(+t.dataset.n); return; }
  if (act === 'pista') { abrirPista(siguientePistaLibre(), true); return; }
  if (act === 'verPista') { var k = t.dataset.k, cuesta = S.g.abiertas.indexOf(k) < 0; abrirPista(k, cuesta); return; }
  if (act === 'oir') { hablaPregunta(); return; }
  if (act === 'ayuda') { pedirAyuda(); return; }
  if (act === 'eligeAyuda') { S.g.ayudaDe = +t.dataset.i; CAPA.className = ''; CAPA.innerHTML = ''; var hh = S.g.equipos[S.g.ayudaDe]; $('#msg').textContent = hh.e + ' ' + hh.n + ' ayudan: ¡a pensar juntos!'; var bA = $('#bAyuda'); if (bA) bA.disabled = true; decir('Pensad juntos.'); return; }
  if (act === 'cierra') { CAPA.className = ''; CAPA.innerHTML = ''; return; }
  if (act === 'sig') { siguiente(); return; }
  if (act === 'diploma') { diploma(); return; }
});
document.addEventListener('keydown', function (ev) {
  if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
  if (S.p === 'juego' && S.g) {
    if (CAPA.classList.contains('on') && S.g.resuelto && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); siguiente(); return; }
    if (/^[0-9]$/.test(ev.key) && !CAPA.classList.contains('on')) { responder(ev.key === '0' ? 10 : +ev.key); return; }
  }
  if (ev.key === 'Escape') { CAPA.className = ''; CAPA.innerHTML = ''; }
});
document.addEventListener('visibilitychange', function () { if (document.hidden) { T.clear(); if (root.speechSynthesis) try { root.speechSynthesis.cancel(); } catch (e) {} } });

/* para las pruebas */
root.SumaSafari = { genProblema: genProblema, genRonda: genRonda, puntos: puntos, nivelRonda: nivelRonda, nivelParada: nivelParada, ranking: ranking, estrellasMision: estrellasMision, NIVELES: NIVELES, PARADAS: PARADAS, estado: S };

render();
})(window);
